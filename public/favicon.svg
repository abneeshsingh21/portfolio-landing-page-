<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Glass Tint -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111422"/>
      <stop offset="42%" stop-color="#090b14"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <!-- Chromatic Refraction Rim (Portfolio Signature Liquid Palette) -->
    <linearGradient id="chromaRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fd0ff"/>
      <stop offset="34%" stop-color="#c7b2ff"/>
      <stop offset="68%" stop-color="#8ff0d6"/>
      <stop offset="100%" stop-color="#9fd0ff"/>
    </linearGradient>

    <!-- Top Inset Specular Glass Edge -->
    <linearGradient id="specularEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Top-Left Light Caustic Pool -->
    <radialGradient id="causticTop" cx="26%" cy="22%" r="58%">
      <stop offset="0%" stop-color="#9fd0ff" stop-opacity="0.36"/>
      <stop offset="45%" stop-color="#c7b2ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c7b2ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-Right Reflected Mint Caustic -->
    <radialGradient id="causticBottom" cx="74%" cy="76%" r="52%">
      <stop offset="0%" stop-color="#8ff0d6" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8ff0d6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8ff0d6" stop-opacity="0"/>
    </radialGradient>

    <!-- Curved Liquid Surface Sheen -->
    <linearGradient id="liquidSheen" x1="0%" y1="0%" x2="80%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Lettermark Glass Fill -->
    <linearGradient id="letterFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#f0f5ff"/>
      <stop offset="72%" stop-color="#dbe6ff"/>
      <stop offset="100%" stop-color="#c8f5ec"/>
    </linearGradient>

    <!-- Specular Highlight for Letterforms -->
    <linearGradient id="letterSpec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Deep Glass Drop Shadow -->
    <filter id="glassShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Mark Depth Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Glass Squircle / Pebble Base -->
  <rect x="28" y="28" width="456" height="456" rx="124" fill="url(#glassBg)" filter="url(#glassShadow)"/>

  <!-- Optical Caustic Pools (Diffuse Internal Refraction) -->
  <rect x="28" y="28" width="456" height="456" rx="124" fill="url(#causticTop)"/>
  <rect x="28" y="28" width="456" height="456" rx="124" fill="url(#causticBottom)"/>

  <!-- Specular Convex Surface Arc (Curved Glass Lens Sheen) -->
  <path d="M 64 150 C 95 86, 168 50, 256 50 C 344 50, 417 86, 448 150 C 398 96, 332 72, 256 72 C 180 72, 114 96, 64 150 Z" fill="url(#liquidSheen)"/>

  <!-- Liquid Chromatic Bezel Outer Ring -->
  <rect x="28" y="28" width="456" height="456" rx="124" fill="none" stroke="url(#chromaRim)" stroke-width="2.5" opacity="0.9"/>

  <!-- Inset Specular Glass Edge (Upper Light Rim) -->
  <rect x="29.5" y="29.5" width="453" height="453" rx="122.5" fill="none" stroke="url(#specularEdge)" stroke-width="1.5"/>

  <!-- Central Architectural Monogram Mark (AS Ligature) -->
  <g id="mark" filter="url(#markShadow)">
    <!-- Letter A -->
    <path d="M 194 136 C 200 136, 206 138, 210 144 L 284 362 C 286 367, 282 372, 276 372 L 244 372 C 239 372, 235 369, 233 364 L 217 318 L 165 318 L 151 364 C 149 369, 145 372, 140 372 L 108 372 C 102 372, 98 367, 100 362 L 174 144 C 178 138, 184 136, 194 136 Z M 192 216 L 174 274 L 208 274 Z" fill="url(#letterFill)"/>

    <!-- Letter S (Liquid Ribbon Weave) -->
    <path d="M 382 196 C 382 154, 350 132, 302 132 C 278 132, 257 140, 242 152 C 238 155, 238 160, 241 164 L 255 182 C 258 186, 263 186, 267 183 C 277 175, 289 169, 303 169 C 327 169, 342 180, 342 196 C 342 213, 329 223, 298 236 C 256 253, 234 277, 234 314 C 234 354, 265 376, 314 376 C 342 376, 366 367, 382 355 C 386 352, 386 346, 383 342 L 368 322 C 365 318, 360 318, 356 321 C 344 330, 330 336, 314 336 C 286 336, 272 325, 272 312 C 272 296, 285 285, 316 272 C 358 254, 382 230, 382 196 Z" fill="url(#letterFill)"/>

    <!-- Specular Highlight Accents on Letter Tops -->
    <path d="M 188 140 L 200 140 L 210 170 C 205 166, 193 166, 188 170 Z" fill="url(#letterSpec)" opacity="0.8"/>
    <path d="M 276 178 C 285 171, 296 168, 306 168 C 328 168, 340 176, 342 190 C 336 178, 320 172, 302 172 C 290 172, 281 175, 276 178 Z" fill="url(#letterSpec)" opacity="0.9"/>
  </g>
</svg>